{% extends "base.html" %}

{% block title %}{{ msg.subject }} — Mailing Service{% endblock %}

{% block content %}
<h1 class="mb-4">{{ msg.subject }}</h1>

<div class="card mb-4">
    <div class="card-body">
        <dl class="row mb-0">
            <dt class="col-sm-4">Тема письма</dt>
            <dd class="col-sm-8">{{ msg.subject }}</dd>
            <dt class="col-sm-4">Тело письма</dt>
            <dd class="col-sm-8">{{ msg.body|linebreaksbr }}</dd>
        </dl>
    </div>
</div>

<div class="d-flex flex-wrap gap-2">
    <a href="{% url 'mailing:message_update' msg.pk %}" class="btn btn-secondary">Редактировать</a>
    <a href="{% url 'mailing:message_delete' msg.pk %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'mailing:message_list' %}" class="btn btn-outline-secondary">Назад к списку</a>
</div>
{% endblock %}
