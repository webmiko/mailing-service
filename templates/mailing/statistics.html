{% extends "base.html" %}

{% block title %}Статистика — Mailing Service{% endblock %}

{% block content %}
<h1 class="mb-4">Статистика рассылок</h1>

<div class="row g-3">
    <div class="col-sm-6 col-lg-3">
        <div class="card text-center h-100">
            <div class="card-body">
                <div class="stat-value text-dark">{{ total_mailings }}</div>
                <div class="stat-label text-muted">Всего рассылок</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-lg-3">
        <div class="card text-center h-100">
            <div class="card-body">
                <div class="stat-value text-dark">{{ total_attempts }}</div>
                <div class="stat-label text-muted">Всего попыток</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-lg-3">
        <div class="card text-center h-100">
            <div class="card-body">
                <div class="stat-value text-success">{{ success_attempts }}</div>
                <div class="stat-label text-muted">Успешных</div>
            </div>
        </div>
    </div>
    <div class="col-sm-6 col-lg-3">
        <div class="card text-center h-100">
            <div class="card-body">
                <div class="stat-value text-danger">{{ failure_attempts }}</div>
                <div class="stat-label text-muted">Неуспешных</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
