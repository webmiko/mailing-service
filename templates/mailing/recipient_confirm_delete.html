{% extends "base.html" %}

{% block title %}Удаление получателя — Mailing Service{% endblock %}

{% block content %}
<h1 class="mb-4">Удаление получателя</h1>

<div class="card" style="max-width: 500px;">
    <div class="card-body">
        <p class="mb-4 fs-5">Вы уверены, что хотите удалить получателя <strong>{{ recipient.full_name }}</strong> ({{ recipient.email }})?</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url 'mailing:recipient_list' %}" class="btn btn-outline-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
